[cc_gen_pdf_paths]
# Specify the full-path location of the mkdocs of CC are located

# full path to the mkdocs.yml nav definition file
CC_MKDOCS_YML=/root/cc-docs/mkdocs.yml

# use the /docs sub-dir where it contains the *.md files
CC_MKDOCS_SOURCE_DIR=/root/cc-docs/docs/
#CC_MKDOCS_SOURCE_DIR=/root/cc-manual-gen/sphinx/docs

# destination directory. Ideally, this is the sphix/src directory
CC_SPHINX_SRC_DIR=/root/CCDocs-PDFGen/sphinx/src/

# since in the SOURCE_DIR has directories/files which can be ignored. Place inside these to this ignore file config under conf directory
CC_PDFGEN_IGNORE_FILE=ignore_file_list.txt

CC_LOG_FILE=/root/CCDocs-PDFGen/sphinx/tools/log/pdf_gen.log

 
[cc_gen_pdf_options]
# Add in case something we have planned 
 
